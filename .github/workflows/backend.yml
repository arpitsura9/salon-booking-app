name: Backend CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'microservices/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'microservices/**'
      - '.github/workflows/backend.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - booking-service
          - category-service
          - eureka-server
          - gateway-server
          - notifications
          - payment-service
          - review
          - salon-service
          - service-offering
          - user-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build
        working-directory: microservices/${{ matrix.service }}
        run: mvn -B package -Dmaven.test.skip=true
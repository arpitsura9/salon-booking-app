name: Frontend Publish (Docker Hub)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-publish.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            REACT_APP_API_URL=/gw
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/salon-frontend-yt:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/salon-frontend-yt:${{ github.sha }}
